apiVersion: v1
kind: ConfigMap
metadata:
  name: locustfile
data:
  locustfile.py: |
    """In-cluster load test. Same tasks as locust/locustfile.py, without the package import."""

    from locust import HttpUser, between, task

    EXAMPLE = {
        "gender": "Female",
        "SeniorCitizen": 0,
        "Partner": "Yes",
        "Dependents": "No",
        "tenure": 1,
        "PhoneService": "No",
        "MultipleLines": "No phone service",
        "InternetService": "DSL",
        "OnlineSecurity": "No",
        "OnlineBackup": "Yes",
        "DeviceProtection": "No",
        "TechSupport": "No",
        "StreamingTV": "No",
        "StreamingMovies": "No",
        "Contract": "Month-to-month",
        "PaperlessBilling": "Yes",
        "PaymentMethod": "Electronic check",
        "MonthlyCharges": 29.85,
        "TotalCharges": 29.85,
    }
    LONG_TENURE = dict(EXAMPLE)
    LONG_TENURE["tenure"] = 72
    LONG_TENURE["Contract"] = "Two year"
    LONG_TENURE["MonthlyCharges"] = 85.5
    LONG_TENURE["TotalCharges"] = 6156.0


    class ChurnUser(HttpUser):
        wait_time = between(0.01, 0.05)

        @task(6)
        def predict(self):
            self.client.post("/predict", json=EXAMPLE)

        @task(2)
        def predict_batch(self):
            self.client.post("/predict/batch", json={"records": [EXAMPLE, LONG_TENURE]})

        @task(1)
        def health(self):
            self.client.get("/health")
---
apiVersion: batch/v1
kind: Job
metadata:
  name: locust
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: locust
          image: locustio/locust:2.46.7
          imagePullPolicy: IfNotPresent
          args:
            - -f
            - /locust/locustfile.py
            - --headless
            - --users
            - "40"
            - --spawn-rate
            - "10"
            - --run-time
            - "3m"
            - --host
            - http://churn-api
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: locustfile
              mountPath: /locust
      volumes:
        - name: locustfile
          configMap:
            name: locustfile
